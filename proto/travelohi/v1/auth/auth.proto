syntax = "proto3";

package travelohi.v1.auth;

option go_package = "github.com/travelohi/backend/proto/auth/v1;authpb";

service AuthService {
  rpc Login(LoginRequest) returns (AuthResponse) {}

  rpc SendOTP(SendOTPRequest) returns (SendOTPResponse) {}
  rpc LoginWithOTP(LoginWithOTPRequest) returns (AuthResponse) {}

  rpc Register(RegisterRequest) returns (AuthResponse) {}

  rpc Logout(LogoutRequest) returns (LogoutResponse) {}

  rpc GetSecurityQuestion(GetSecurityQuestionRequest) returns (GetSecurityQuestionResponse) {}
  rpc ResetPassword(ResetPasswordRequest) returns (AuthResponse) {}

  rpc CheckEmail(CheckEmailRequest) returns (CheckEmailResponse) {}
}

message RegisterRequest {
string email = 1;
  string password = 2;
  string first_name = 3;
  string last_name = 4;
  string dob = 5;
  string gender = 6;
  bool subscribe_newsletter = 7;
  string captcha_token = 8; 
  int32 security_question_id = 9;
  string security_answer = 10;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  string captcha_token = 3;
}

message SendOTPRequest {
  string email = 1;
}

message SendOTPResponse {
  bool success = 1;
  string message = 2;
}

message LoginWithOTPRequest {
  string email = 1;
  string otp_code = 2;
}

// shared responses
message AuthResponse {
  string access_token = 1; // jwt disimpen disini buat frontend
  string user_id = 2;
  string message = 3;
}

message LogoutRequest {
  string user_id = 1;
}

message LogoutResponse {
  bool success = 1;
  string message = 2;
}

message GetSecurityQuestionRequest {
  string email = 1;
}

message GetSecurityQuestionResponse {
  int32 security_question_id = 1;
}

message ResetPasswordRequest {
  string email = 1;
  string security_answer = 2;
  string new_password = 3;
}

message CheckEmailRequest {
  string email = 1;
  string captcha_token = 2;
}

message CheckEmailResponse {
  bool exists = 1;
}