services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: travelohi_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - travelohi-net

  memcached:
    image: memcached:1.6-alpine
    ports:
      - "11211:11211"
    networks:
      - travelohi-net

  # Microservices
  auth-service:
    build:
      context: .
      dockerfile: deployments/auth.Dockerfile
    ports:
      - "50051:50051"
    environment:
      - DB_URL=postgres://root:secretpassword@postgres:5432/travelohi_db?sslmode=disable
      - MEMCACHED_URL=memcached:11211
      - JWT_SECRET=your-super-secret-key
    depends_on:
      - postgres
      - memcached
    networks:
      - travelohi-net

  account-service:
    build:
      context: .
      dockerfile: deployments/account.Dockerfile
    ports:
      - "50052:50052"
    environment:
      - DB_URL=postgres://root:secretpassword@postgres:5432/travelohi_db?sslmode=disable
      - MEMCACHED_URL=memcached:11211
      - JWT_SECRET=your-super-secret-key
    depends_on:
      - postgres
      - memcached
    networks:
      - travelohi-net

  # Envoy / API Gateway
  envoy:
    image: envoyproxy/envoy:v1.27-latest
    ports:
      - "8080:8080"
      - "9901:9901" #  for admin
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml
    depends_on:
      - auth-service
      - account-service
    networks:
      - travelohi-net

networks:
  travelohi-net:
    driver: bridge
volumes:
  pgdata:
